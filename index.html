<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV 대시보드</title>
    <meta name="description" content="CSV 파일을 끌어다 놓으면 차트 대시보드를 만들어 주는 웹앱 (파일은 브라우저 밖으로 전송되지 않습니다)" />

    <!-- Trunk: Rust 크레이트를 wasm으로 빌드해 링크 -->
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1b1b1b;
        }
        @media (prefers-color-scheme: light) {
            html, body { background: #f8f8f8; }
        }
        canvas#the_canvas_id {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #loading_text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: system-ui, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
            font-size: 18px;
            color: #888;
            text-align: center;
        }
        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 14px;
            border: 4px solid rgba(128, 128, 128, 0.3);
            border-top-color: #4285f4;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text">
        <div class="spinner"></div>
        CSV 대시보드를 불러오는 중…
    </div>
    <noscript>이 앱을 사용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
