[package]
name = "csv_dashboard"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
egui_plot = "0.31"
csv = "1.3"
encoding_rs = "0.8"
rfd = "0.15"
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
