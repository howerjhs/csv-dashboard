name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  TRUNK_VERSION: v0.21.14

jobs:
  web:
    name: Web (WASM) → Netlify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: |
          curl -sSfL "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin trunk
          trunk --version

      - name: Build
        run: trunk build --release --public-url ./

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Netlify
        # PR에서는 빌드만 확인하고, main 브랜치 push 때만 배포한다.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID secrets가 없어 배포를 건너뜁니다."
            exit 0
          fi
          npx --yes netlify-cli@17 deploy --dir=dist --prod --message "${GITHUB_SHA::7}"

  windows:
    name: Windows exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/csv_dashboard.exe out/CSV_Dashboard.exe
          Copy-Item sample_sales.csv out/

      - uses: actions/upload-artifact@v4
        with:
          name: CSV_Dashboard-windows
          path: out

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/CSV_Dashboard.exe
