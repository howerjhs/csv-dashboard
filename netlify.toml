# GitHub Actions가 dist/를 빌드해 netlify-cli로 올리므로 Netlify 쪽 빌드는 하지 않는다.
[build]
  publish = "dist"
  command = "echo 'Built by GitHub Actions'"

# trunk 산출물(js/wasm)은 파일명에 해시가 붙으므로 오래 캐시해도 된다.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
